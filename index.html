<html>
    <style>
        html *{
            position: relative;
            user-select: none;
        }
        h1{
                text-align: center;
        }
        #input{
                text-align: center;
                margin-top: 10px;
        }
        #input input{
                width: 52%;
                font-size: 20px;
                padding: 0.46em;
                transition: 0.3s;
                letter-spacing: 1px;
                border: none;
                border-bottom: 2px solid #000;
                background: transparent;
                color: #000;
        }
        #input input:focus{
                outline: none;
                border-bottom: 2px solid #ff3535;
        }
        .button{
                margin: 0 auto;
                margin-top: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 250px;
                padding: .6em 1.1em;
                border: none;
                border-radius: 5px;
                background-color: #b0b0b0;
                color: #000000;
                font-weight: 600;
                font-size: 1.2em;
        }
        .button:hover{
                background-color: #cacaca;
        }
    </style>


    <head>
        <meta charset="utf-8">
        <title>牌譜コンバータ</title>
    </head>
    <h1>天鳳牌譜コンバータ</h1>
    <div id="input">
        <input type="text" placeholder="牌譜のURLを入力" id="url" autocomplete="off">
    </div>
    <button id="submit" class="button">送信！</button>
    <pre id="result"></pre>

    <script>
        document.getElementById('submit').addEventListener('click', async () => {
            const url = document.getElementById('url').value;

            const logId = url.substr(url.indexOf('2'));
            console.log(logId)

            if (!logId) {
                alert('URLが正しくありません');
                return;
            }

            const res = await fetch('/fetch-log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ logId })
            });

            const text = await res.text();

            const parser = new DOMParser();
            const mjlog = parser.parseFromString(text, "text/html");
            const init = mjlog.querySelectorAll("INIT");

            const seedlist = []
            const initjp = ["東一局","東二局","東三局","東四局","南一局","南二局","南三局","南四局","西一局","西二局","西三局","西四局","北一局","北二局","北三局","北四局"]
            for(let i of init){
                const seed = i.getAttribute("seed").slice(0,2);
                const seedjp = initjp[seed[0]] + new Intl.NumberFormat('ja-JP-u-nu-hanidec').format(seed[1]);
                seedlist.push(seedjp);
            }
            console.log(seedlist);
        });
    </script>
</html>
